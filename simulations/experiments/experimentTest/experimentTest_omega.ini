include common.ini

[Config Omega]
**.tcp.typename = "MpOrb"
**.tcp.tcpAlgorithmClass = "MpOrbOmega"
*.left[0].ppp[0].queue.typename = "MpOrbDeltaQueue"
*.left[0].ppp[0].queue.deltaShuffleFraction = 0.05
*.left[0].ppp[0].queue.deltaShuffleInterval = 0s
*.left[1].ppp[0].queue.typename = "MpOrbDeltaQueue"
*.left[1].ppp[0].queue.deltaShuffleFraction = 0.05
*.left[1].ppp[0].queue.deltaShuffleInterval = 0s
*.client[*].tcp.conn-*.omegaAdditionalIncrease.statistic-recording = true
*.client[*].tcp.conn-*.omegaAdditionalIncrease.result-recording-modes = vector
*.client[*].tcp.conn-*.omegaAdditionalIncrease:vector.vector-recording = true
