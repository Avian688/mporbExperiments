[General]
network = mporbexperiments.simulations.experiments.experimentTestBug.ThreePathBug
ned-path = ../..;../../../../inet4.5/src;../../../../tcpGoodputApplications/src;../../../../tcpPaced/src;../../../../cubic/src;../../../../orbtcp/src;../../../../mptcp/src;../../../../mporb/src
load-libs = ../../../../inet4.5/src/INET ../../../../tcpGoodputApplications/src/tcpGoodputApplications ../../../../tcpPaced/src/tcpPaced ../../../../cubic/src/cubic ../../../../orbtcp/src/orbtcp ../../../../mptcp/src/mptcp ../../../../mporb/src/mporb
sim-time-limit = 9s
seed-set = 8000
record-eventlog = false
cmdenv-express-mode = true

*.scenarioManager.script = xmldoc("handover.xml")
*.configurator.config = xml("<config><interface hosts='**' address='10.x.x.x' netmask='255.x.x.x'/><autoroute metric='hopCount'/></config>")
*.configurator.addDefaultRoutes = false
*.configurator.addSubnetRoutes = false
*.configurator.optimizeRoutes = false
*.client[*].forwarding = false
*.server[*].forwarding = false

**.tcp.typename = "MpOrb"
**.tcp.tcpAlgorithmClass = "MpOrbOmega"
**.tcp.subflowInterfaceBinding = true
*.client[1].tcp.**.numberOfSubflows = 1
*.server[1].tcp.**.numberOfSubflows = 1
**.numberOfSubflows = 3
**.startAllSubflowsAtBeginning = true
**.schedulerMode = "defaultCwnd"
**.tcp.advertisedWindow = 200000000
**.tcp.windowScalingSupport = true
**.tcp.windowScalingFactor = -1
**.tcp.increasedIWEnabled = true
**.tcp.delayedAcksEnabled = false
**.tcp.timestampSupport = true
**.tcp.sackSupport = true
**.tcp.updatedSackEnabled = true
**.tcp.mss = 1200
**.tcp.sendQueueLimit = 4MiB
**.tcp.initialSsthresh = 480000

*.client[*].numApps = 1
*.server[*].numApps = 1
*.client[*].app[0].typename = "MpTcpSessionApp"
*.server[*].app[0].typename = "MpTcpSinkApp"
*.client[0].app[0].connectAddress = "server[0]>right[0]"
*.client[0].tcp.subflowRemoteAddresses = "server[0]>right[0] server[0]>right[1] server[0]>right[2]"
*.client[1].app[0].connectAddress = "server[1]>right[2]"
*.client[1].tcp.subflowRemoteAddresses = "server[1]>right[2]"
*.client[*].app[0].localPort = 4000
*.client[*].app[0].connectPort = 1000
*.server[*].app[0].localPort = 1000
*.client[1].app[0].tOpen = 4.95s
*.client[1].app[0].tSend = 4.95s
*.client[0].app[0].tOpen = 1s
*.client[0].app[0].tSend = 1s
*.client[*].app[0].tClose = 10s
*.client[*].app[0].sendBytes = 1MiB
*.client[*].app[0].dataTransferMode = "bytecount"
*.server[*].app[0].serverThreadModuleType = "tcpgoodputapplications.applications.tcpapp.TcpGoodputSinkAppThread"
**.goodputInterval = 20ms
**.throughputInterval = 20ms

*.left[*].ppp[0].queue.typename = "MpOrbDeltaQueue"
*.left[*].ppp[0].queue.packetCapacity = 395
**.ppp[*].queue.typename = "DropTailQueue"
**.ppp[*].queue.packetCapacity = 1000
**.additiveIncreasePercent = 0.05
**.eta = 0.95
**.alpha = 0.03
**.pintBits = 0
**.pintFlowCountBits = 0
**.flowCountSketchEnabled = false
**.pintFeedbackProbability = 1
**.pintSeparateQueueingDelay = true

# Keep only the measurements needed to distinguish shuffle, loss recovery and HoL.
*.client[0].tcp.conn-*.cwnd.result-recording-modes = vector(removeRepeats)
*.client[0].tcp.conn-*.U.result-recording-modes = vector(removeRepeats)
*.client[0].tcp.conn-*.srtt.result-recording-modes = vector(removeRepeats)
*.client[0].tcp.conn-*.mbytesInFlight.result-recording-modes = vector(removeRepeats)
*.client[0].tcp.conn-*.numRtos.result-recording-modes = vector(removeRepeats)
*.client[0].tcp.conn-*.recoveryPoint.result-recording-modes = vector(removeRepeats)
*.client[0].tcp.conn-*.sndUna.result-recording-modes = vector(removeRepeats)
*.client[0].tcp.conn-*.mpOrbDeltaAppliedShuffle.result-recording-modes = vector
*.client[0].tcp.conn-*.metaReinjectedBytes.result-recording-modes = vector
*.server[0].tcp.conn-*.holBlockedBytes.result-recording-modes = vector(removeRepeats)
*.server[0].tcp.conn-*.metaExpectedDsn.result-recording-modes = vector(removeRepeats)
*.server[0].tcp.conn-*.throughput.result-recording-modes = vector
*.server[*].app[0].thread_*.goodput.result-recording-modes = vector
**.result-recording-modes = -
**.paceValue.vector-recording = false
**.vector-recording-intervals = 4.75..
**.scalar-recording = false

[Config Omega5]
*.left[*].ppp[0].queue.deltaShuffleFraction = 0.05

[Config Omega10]
*.left[*].ppp[0].queue.deltaShuffleFraction = 0.10

[Config Omega5NoLoss]
extends = Omega5
*.scenarioManager.script = xml("<scenario/>")

[Config Omega10NoLoss]
extends = Omega10
*.scenarioManager.script = xml("<scenario/>")
