include ../experimentLeo/topology.ini

[Config LeoPingBase]
*.configurator.configLocation = "../../../../leosatellites/simulations/leoSaves"
**.loadFiles = true
*.configurator.kPathSnapshotMode = "load"
*.configurator.kPathCoreSnapshotProfile = ""
*.configurator.kPathsEdgeDisjoint = true
*.configurator.kPathMaxSharedLinks = -1
# This legacy-named flag enables saved-path TCP routing too; it creates no ping apps.
*.configurator.kPathPingRouting = true
*.configurator.allowRouteSnapshotOverwrite = false
*.userTerminal[5].app[*].rtt.statistic-recording = true
*.userTerminal[5].app[*].rtt.result-recording-modes = vector
*.userTerminal[5].app[*].rtt:vector.vector-recording = true
*.userTerminal[6].app[*].rtt.statistic-recording = true
