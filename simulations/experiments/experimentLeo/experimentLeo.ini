*.userTerminal[14].app[0].thread_*.goodput.statistic-recording = true
*.userTerminal[14].app[0].thread_*.goodput.result-recording-modes = vector
*.userTerminal[14].app[0].thread_*.goodput:vector.vector-recording = true
*.userTerminal[5].tcp.conn-*.rtt.statistic-recording = true
*.userTerminal[5].tcp.conn-*.rtt.result-recording-modes = vector
*.userTerminal[5].tcp.conn-*.rtt:vector.vector-recording = true
*.userTerminal[6].tcp.conn-*.rtt.statistic-recording = true
