include topology.ini

[Config LeoTransport]
*.configurator.configLocation = "../../../../leosatellites/simulations/leoSaves"
**.loadFiles = true
*.configurator.kPathSnapshotMode = "load"
*.configurator.kPathCoreSnapshotProfile = ""
*.configurator.kPathsEdgeDisjoint = true
*.configurator.kPathMaxSharedLinks = -1
# This legacy-named flag enables saved-path TCP routing too; it creates no ping apps.
*.configurator.kPathPingRouting = true
*.configurator.allowRouteSnapshotOverwrite = false
**.interfaceType = "leosatellites.linklayer.ppp.PppInterfaceMutable"
**.tcp.advertisedWindow = 200000000
**.tcp.windowScalingSupport = true
**.tcp.windowScalingFactor = -1
**.tcp.increasedIWEnabled = true
**.tcp.delayedAcksEnabled = false
**.tcp.timestampSupport = true
**.tcp.ecnWillingness = false
**.tcp.nagleEnabled = true
**.tcp.sackSupport = true
**.tcp.updatedSackEnabled = true
**.tcp.stopOperationTimeout = 4000s
**.tcp.mss = 1200
**.tcp.initialSsthresh = 4800000
**.tcp.sendQueueLimit = 4MiB
**.tcp.subflowInterfaceBinding = false
**.schedulerMode = "defaultCwnd"
**.startAllSubflowsAtBeginning = true
**.subflowStartTimes = ""
**.additiveIncreasePercent = 0.05
**.eta = 0.95
**.alpha = 0.03
**.tcp.pintFeedbackProbability = 1
**.pintFlowCountBits = 8
**.pintMaxFlowCount = 65535
**.pintUseAverageRtt = true
**.tcp.pintUseInitialPhase = true
**.tcp.pintUseInitialPhaseFlowCount = true
**.ppp[*].queue.packetCapacity = 300
**.ppp[*].queue.pintInitialRtt = 10ms
**.ppp[*].queue.flowCountSketchEnabled = true
**.ppp[*].queue.flowCardinalityBits = 4096
**.ppp[*].queue.flowSketchSeed = 1337
**.ppp[*].queue.pintBits = 8
**.ppp[*].queue.pintAutoScaleEncoding = false
**.ppp[*].queue.pintLogBase = 1.05
**.goodputInterval = 1s
**.throughputInterval = 1s
**.ipv4.ip.kPathTcpClientPort = 4000
**.ipv4.ip.kPathTcpServerPort = 1000
**.tcp.conn-temp.**.statistic-recording = false
**.tcp.conn-temp.**.vector-recording = false
*.userTerminal[10].app[0].thread_*.goodput.statistic-recording = true
*.userTerminal[10].app[0].thread_*.goodput.result-recording-modes = vector
*.userTerminal[10].app[0].thread_*.goodput:vector.vector-recording = true
*.userTerminal[11].app[0].thread_*.goodput.statistic-recording = true
*.userTerminal[11].app[0].thread_*.goodput.result-recording-modes = vector
*.userTerminal[11].app[0].thread_*.goodput:vector.vector-recording = true
*.userTerminal[12].app[0].thread_*.goodput.statistic-recording = true
*.userTerminal[12].app[0].thread_*.goodput.result-recording-modes = vector
